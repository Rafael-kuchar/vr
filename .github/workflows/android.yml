name: Build VR Phone Bridge (ALVR)

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout VR Phone Bridge
        uses: actions/checkout@v4

      - name: Checkout PhoneVR and its pinned submodules
        uses: actions/checkout@v4
        with:
          repository: PhoneVR-Developers/PhoneVR
          ref: v2.0.0-beta
          path: .upstream/PhoneVR
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package was removed from Google's repository.
          # Install only platform-tools here; the next step installs pinned packages.
          packages: 'platform-tools'

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          # Process substitution avoids pipefail treating yes's expected SIGPIPE as a failure.
          sdkmanager --licenses < <(yes)
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libssl-dev libclang-dev protobuf-compiler zip unzip

      - name: Set up Rust for ALVR Android client core
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Prepare PhoneVR ALVR noGvr dependencies
        working-directory: .upstream/PhoneVR/code/mobile/android/PhoneVR
        shell: bash
        run: |
          chmod +x prepare-alvr-deps.sh
          # Keep the dependency versions pinned by the PhoneVR/ALVR release.
          # The upstream helper runs `cargo update`, which can move a 20.8.0
          # client onto newer, incompatible crates during a later rebuild.
          sed -i '/^[[:space:]]*cargo update[[:space:]]*$/d' prepare-alvr-deps.sh
          ./prepare-alvr-deps.sh nogvr

      - name: Apply VR Phone Bridge integration
        run: |
          python3 tools/patch_phonevr.py \
            --phonevr .upstream/PhoneVR/code/mobile/android/PhoneVR \
            --overlay android/phonevr-overlay
          MANIFEST=.upstream/PhoneVR/code/mobile/android/PhoneVR/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          grep -q 'com.google.ar.core' "$MANIFEST"
          grep -q 'BridgeTracking' .upstream/PhoneVR/code/mobile/android/PhoneVR/app/src/main/java/viritualisres/phonevr/ALVRActivity.java

      - name: Provide CI-only signing and Firebase config files
        working-directory: .upstream/PhoneVR/code/mobile/android/PhoneVR
        shell: bash
        run: |
          cat > keystore.properties <<'PROPS'
          storeFile=PhoneVRKeyStorePR.jks
          keyAlias=PhoneVRKeyPR
          PROPS
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "vr-phone-bridge-ci",
              "storage_bucket": "vr-phone-bridge-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.vrhands.bridge" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "CI_ONLY_NOT_A_REAL_API_KEY" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Extract Cardboard native library
        working-directory: .upstream/PhoneVR/code/mobile/android/PhoneVR
        run: bash ./gradlew :app:extractNdk --no-daemon

      - name: Discover ALVR noGvr debug task
        id: find_nogvr_task
        working-directory: .upstream/PhoneVR/code/mobile/android/PhoneVR
        shell: bash
        run: |
          set -euo pipefail
          TASKS="$(bash ./gradlew :app:tasks --all --console=plain --no-daemon)"
          printf '%s\n' "$TASKS"
          TASK="$(printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /^assemble.*nogvr.*debug$/ { print $1; exit }')"
          if [[ -z "$TASK" ]]; then
            echo '::error::No noGvr debug assemble task exists in this PhoneVR checkout.'
            echo 'Available assemble tasks:'
            printf '%s\n' "$TASKS" | awk 'tolower($1) ~ /^assemble/ { print $1 }'
            exit 1
          fi
          echo "Using Gradle task: :app:$TASK"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

      - name: Build ALVR noGvr debug APK
        working-directory: .upstream/PhoneVR/code/mobile/android/PhoneVR
        run: bash ./gradlew ":app:${{ steps.find_nogvr_task.outputs.task }}" --no-daemon -x spotlessCheck --stacktrace

      - name: Validate hand-tracking script syntax
        run: python3 -m py_compile "pc/hands__66_ (2).py" tools/patch_phonevr.py

      - name: Assemble user test package
        shell: bash
        run: |
          mkdir -p dist/pc
          APK="$(find .upstream/PhoneVR/code/mobile/android/PhoneVR/app/build/outputs/apk -type f -iname '*nogvr*debug*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo '::error::The noGvr debug APK was not found after the build.'
            find .upstream/PhoneVR/code/mobile/android/PhoneVR/app/build/outputs/apk -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "Packaging APK: $APK"
          cp "$APK" dist/VRPhoneBridge-ALVR.apk
          cp "pc/hands__66_ (2).py" pc/hand_landmarker.task pc/requirements.txt pc/start_hands.bat pc/check_phone_camera.bat dist/pc/
          cd dist
          zip -r VRPhoneBridge-PC-hands.zip pc

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VRPhoneBridge-ALVR-beta
          path: |
            dist/VRPhoneBridge-ALVR.apk
            dist/VRPhoneBridge-PC-hands.zip
          if-no-files-found: error
          retention-days: 14
